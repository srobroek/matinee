name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install libdbus-1-dev for keyring linux-native-sync-persistent
        run: |
          sudo env DEBIAN_FRONTEND=noninteractive apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install --no-install-recommends -y libdbus-1-dev
      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install libdbus-1-dev for keyring linux-native-sync-persistent
        if: runner.os == 'Linux'
        run: |
          sudo env DEBIAN_FRONTEND=noninteractive apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install --no-install-recommends -y libdbus-1-dev
      - uses: dtolnay/rust-toolchain@1.85.0
      - run: cargo test --workspace --all-targets

  dependency-provenance:
    name: Dependency provenance (Rust 1.85)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install libdbus-1-dev for keyring linux-native-sync-persistent
        run: |
          sudo env DEBIAN_FRONTEND=noninteractive apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install --no-install-recommends -y libdbus-1-dev
      - uses: dtolnay/rust-toolchain@1.85.0
      - uses: dtolnay/rust-toolchain@1.88.0
      - name: Install cargo-deny 0.20.2
        run: cargo +1.88.0 install cargo-deny --version 0.20.2 --locked
      - name: Build locked workspace dependency graph
        run: cargo +1.85.0 build --locked --workspace --all-targets
      - name: Test locked workspace
        run: cargo +1.85.0 test --workspace --all-targets --locked
      - name: Check locked advisories, bans, licenses and sources
        run: |
          cargo +1.88.0 deny --version
          cargo +1.88.0 deny check
