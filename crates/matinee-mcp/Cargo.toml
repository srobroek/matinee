[package]
name = "matinee-mcp"
version = "0.0.2"
edition = "2024"
rust-version = "1.85"
publish = false

[dependencies]
matinee-daemon = { path = "../matinee-daemon" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util", "net", "sync"] }
