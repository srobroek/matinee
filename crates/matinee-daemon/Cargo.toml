[package]
name = "matinee-daemon"
version = "0.0.2"
edition = "2024"
rust-version = "1.85"
publish = false

[dependencies]
matinee-runtime = { path = "../matinee-runtime" }
matinee-security = { path = "../matinee-security" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "process"] }
tokio-tungstenite = "=0.30.0"
uuid = { version = "1", features = ["v7"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
