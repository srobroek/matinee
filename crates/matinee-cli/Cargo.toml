[package]
name = "matinee"
version = "0.0.2"
edition = "2024"
rust-version = "1.85"
description = "Browser environment checks for coding agents"
license = "Apache-2.0"
repository = "https://github.com/srobroek/matinee"
homepage = "https://github.com/srobroek/matinee"
readme = "../../README.md"
keywords = ["browser", "automation", "agents", "workflow"]
categories = ["command-line-utilities", "development-tools::testing"]

[dependencies]
matinee-daemon = { path = "../matinee-daemon" }
matinee-fixture = { path = "../matinee-fixture" }
matinee-mcp = { path = "../matinee-mcp" }
tokio = { version = "1", features = ["rt", "macros", "io-std", "io-util", "signal"] }
uuid = { version = "1", features = ["v7"] }
